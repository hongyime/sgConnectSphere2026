minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # Public Git commit for v6.0.0, not a credential.
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
        args: [--fix=no]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=1000]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: https://github.com/Yelp/detect-secrets
    # Public Git commit for v1.5.0, not a credential.
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        stages: [pre-commit]
        args: [--no-verify]

  - repo: local
    hooks:
      - id: commit-message
        name: Conventional commit message
        entry: python scripts/check_metadata.py commit-msg
        language: python
        stages: [commit-msg]
      - id: branch-name
        name: Branch naming convention
        entry: python scripts/check_metadata.py branch
        language: python
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: api-routes
        # Fail on api/foo.ts + api/foo/index.ts collisions (SCRUM-42 regression)
        # and keep the file count under the Vercel Hobby soft limit. See
        # docs/adr/ADR-014-* and BDR T-56.
        name: Vercel /api/ route conventions
        entry: python scripts/check_api_routes.py
        language: python
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        files: ^api/

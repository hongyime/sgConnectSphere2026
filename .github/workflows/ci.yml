name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tooling
        run: |
          python -m venv .venv-tools
          .venv-tools/bin/python -m pip install -r tooling/requirements.txt
      - name: Repository hygiene and tooling tests
        run: python scripts/check.py
      - name: docs/testing/tc-coverage.md is current
        run: |
          .venv-tools/bin/python scripts/tc_coverage_audit.py
          if ! git diff --exit-code -- docs/testing/tc-coverage.md; then
            echo "::error::docs/testing/tc-coverage.md is stale. Re-run scripts/tc_coverage_audit.py and commit the result." >&2
            exit 1
          fi
      - name: Report scope
        if: always()
        run: |
          echo 'Repository checks cover file hygiene, secret detection, and tooling tests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Application build and compiled API tests run in the application-checks job.' >> "$GITHUB_STEP_SUMMARY"

  pr-conventions:
    name: pr-conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate PR title and source branch
        if: github.event_name == 'pull_request'
        run: python scripts/check_metadata.py pr
      - name: Explain non-PR run
        if: github.event_name != 'pull_request'
        run: echo 'PR metadata is not applicable to this event.'

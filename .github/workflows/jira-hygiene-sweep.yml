name: Jira Hygiene Sweep

# Fills an empty Team with IS212 and an empty assignee with the reporter.
# Subtasks inherit Team, so the script does not write Team on them.
# Jira's free plan cannot run the equivalent automation rules.
#
# A failure only marks this scheduled run red. It does not change the
# repository. Dry-run locally with `python scripts/jira_hygiene_sweep.py`.
# See docs/jira-agent-workflow.md.

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Asia/Singapore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jira-hygiene-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fill missing Team and assignee
        env:
          JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'SCRUM' }}
        run: |
          if [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "::warning::JIRA_API_TOKEN not configured; skipping." >&2
            exit 0
          fi
          python scripts/jira_hygiene_sweep.py --yes

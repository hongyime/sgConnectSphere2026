name: PR guardrails

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to backfill
        required: true
        type: string
      base_sha:
        description: PR base commit SHA
        required: true
        type: string
      head_sha:
        description: PR head commit SHA
        required: true
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  pr-guardrails:
    name: pr-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare requested PR content for backfill
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PR_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-content"
          git archive "$PR_HEAD_SHA" docs/testing/runs | tar -x -C "$RUNNER_TEMP/pr-content"
      - name: Check reference binaries and PR limits
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        id: guardrails
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/check_pr_guardrails.py \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --pr-number "$PR_NUMBER"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/check_pr_guardrails.py \
              --base "$DISPATCH_BASE_SHA" \
              --head "$DISPATCH_HEAD_SHA" \
              --pr-number "$DISPATCH_PR_NUMBER"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/check_pr_guardrails.py \
              --base "$PUSH_BASE_SHA" \
              --head "$PUSH_HEAD_SHA"
          else
            python scripts/check_pr_guardrails.py \
              --base "$MERGE_GROUP_BASE_SHA" \
              --head "$MERGE_GROUP_HEAD_SHA" \
              --merge-group
          fi

      - name: Publish backfill check on PR head
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          BACKFILL_CONCLUSION: ${{ steps.guardrails.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$REPOSITORY/check-runs" \
            -f name=pr-guardrails \
            -f "head_sha=$PR_HEAD_SHA" \
            -f status=completed \
            -f "conclusion=$BACKFILL_CONCLUSION" \
            -f 'output[title]=PR guardrails backfill' \
            -f 'output[summary]=Validated the requested PR head without pushing a commit.'

  test-evidence:
    name: test-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install evidence-check dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Prepare requested PR content for backfill
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PR_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-content"
          git archive "$PR_HEAD_SHA" docs/testing/runs | tar -x -C "$RUNNER_TEMP/pr-content"
      - name: Check manual-run evidence atomicity
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        id: evidence
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/check_test_evidence.py \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/check_test_evidence.py \
              --base "$DISPATCH_BASE_SHA" \
              --head "$DISPATCH_HEAD_SHA" \
              --content-root "$RUNNER_TEMP/pr-content"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/check_test_evidence.py \
              --base "$PUSH_BASE_SHA" \
              --head "$PUSH_HEAD_SHA"
          else
            python scripts/check_test_evidence.py --merge-group
          fi

      - name: Publish evidence backfill check on PR head
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          BACKFILL_CONCLUSION: ${{ steps.evidence.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$REPOSITORY/check-runs" \
            -f name=test-evidence \
            -f "head_sha=$PR_HEAD_SHA" \
            -f status=completed \
            -f "conclusion=$BACKFILL_CONCLUSION" \
            -f 'output[title]=Test evidence backfill' \
            -f 'output[summary]=Validated the requested PR head without pushing a commit.'

name: PR guardrails

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to backfill
        required: true
        type: string
      base_sha:
        description: PR base commit SHA
        required: true
        type: string
      head_sha:
        description: PR head commit SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-guardrails:
    name: pr-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check reference binaries and PR limits
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/check_pr_guardrails.py \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --pr-number "$PR_NUMBER"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/check_pr_guardrails.py \
              --base "$DISPATCH_BASE_SHA" \
              --head "$DISPATCH_HEAD_SHA" \
              --pr-number "$DISPATCH_PR_NUMBER"
          else
            python scripts/check_pr_guardrails.py \
              --base "$MERGE_GROUP_BASE_SHA" \
              --head "$MERGE_GROUP_HEAD_SHA" \
              --merge-group
          fi

  test-evidence:
    name: test-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install evidence-check dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check manual-run evidence atomicity
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/check_test_evidence.py \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/check_test_evidence.py \
              --base "$DISPATCH_BASE_SHA" \
              --head "$DISPATCH_HEAD_SHA"
          else
            python scripts/check_test_evidence.py --merge-group
          fi

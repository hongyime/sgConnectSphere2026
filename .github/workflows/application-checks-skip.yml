name: Application Checks (skip)

# GitHub's own documented workaround for a required status check that has a
# paths filter: https://docs.github.com/en/actions/using-workflows/skipping-workflow-runs
#
# application-checks.yml only triggers when files under its `paths:` list
# change. Branch protection requires the "application-checks" status check to
# be present, but a workflow with a paths filter never *reports* a status at
# all for a PR that doesn't touch those paths -- it doesn't fail, it simply
# never runs, and GitHub treats "no status" as unsatisfied for a required
# check. A docs-only PR (or any PR touching only files outside that list)
# would be permanently blocked from merging with no way to satisfy the check.
#
# This companion workflow triggers on the exact complement (paths-ignore
# mirrors application-checks.yml's paths list) and reports a job with the
# same name, "application-checks", that succeeds immediately. Together the
# two workflows cover every PR exactly once for the common case of a PR that
# is either all-app-paths or all-non-app-paths.
#
# Known caveat, inherent to this GitHub-documented pattern (not a bug here):
# a PR that mixes an app path and a non-app path in the same diff triggers
# BOTH workflows for the same commit. That's expected -- keep PRs scoped to
# one logical change (repository convention already asks for this) and it
# doesn't come up in practice.
#
# Keep this file's paths-ignore list identical to application-checks.yml's
# paths list. If one changes, update the other in the same PR.

on:
  pull_request:
    paths-ignore:
      - "api/**"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "playwright.auth.config.ts"
      - "vercel.json"
      - ".github/workflows/application-checks.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "api/**"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "playwright.auth.config.ts"
      - "vercel.json"
      - ".github/workflows/application-checks.yml"

permissions:
  contents: read

jobs:
  application-checks:
    name: application-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No application-relevant files changed
        run: |
          echo "Skipping application checks: this diff only touches paths outside application-checks.yml's paths filter."

name: Update PR branches

# Since the merge queue (docs/decisions/0012-merge-queue.md) the queue itself
# tests each PR against the latest main, so branches no longer need to be kept
# up to date to merge and the scheduled and push triggers were removed. Every
# automatic update pushed to a PR branch re-ran CI and produced a Vercel
# preview deployment (decision 0010). Run this manually when a specific PR
# needs main merged in, for example to resolve a reported conflict.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pr-branches
  cancel-in-progress: false

jobs:
  update-branches:
    name: Update stale same-repository PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Update branches that are behind main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$REPOSITORY" \
            --base main \
            --state open \
            --json number,isDraft,headRepository,mergeStateStatus \
            --jq '.[] | select(.isDraft == false) | select(.headRepository.nameWithOwner == "'"$REPOSITORY"'") | select(.mergeStateStatus == "BEHIND") | .number' |
          while IFS= read -r pr_number; do
            if [ -n "$pr_number" ]; then
              echo "Updating PR #$pr_number"
              gh pr update-branch "$pr_number" --repo "$REPOSITORY"
            fi
          done

name: Application Checks

on:
  pull_request:
    paths:
      - "api/**"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "playwright.auth.config.ts"
      - "vercel.json"
      - ".github/workflows/application-checks.yml"
  # Also run on pushes to main so post-merge build failures are visible
  # in the Actions log. Teammates without Vercel dashboard access read
  # this run to debug a red Vercel status.
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "playwright.auth.config.ts"
      - "vercel.json"
      - ".github/workflows/application-checks.yml"

permissions:
  contents: read

jobs:
  application-checks:
    name: application-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-password # pragma: allowlist secret - disposable CI database only
          POSTGRES_DB: connectsphere_notification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Backend unit tests including registration and login
        run: npm test --workspace backend

      - name: Login and recovery PostgreSQL acceptance tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-local-password@127.0.0.1:5432/connectsphere_notification_test # pragma: allowlist secret - disposable CI database only
        run: npm run test:auth:db --workspace backend

      - name: Build
        run: npm run build

      - name: Compiled API runtime tests without provider credentials
        run: npm run test:runtime

      - name: PostgreSQL outbox and intercepted provider regression tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-local-password@127.0.0.1:5432/connectsphere_notification_test # pragma: allowlist secret - disposable CI database only
        run: npm run test:notifications

      - name: Real Redis transport regression tests
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Login and recovery desktop and mobile browser tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-local-password@127.0.0.1:5432/connectsphere_notification_test # pragma: allowlist secret - disposable CI database only
        run: npm run test:e2e:auth

      - name: Playwright scaffold
        run: npm run test:e2e:scaffold

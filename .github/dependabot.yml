version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /tooling
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    # cyclonedx-bom 7.4 requires chardet >=5.1,<6; revisit with its upgrade.
    ignore:
      - dependency-name: chardet
        versions: [">=6"]
    groups:
      tooling:
        patterns: ['*']
